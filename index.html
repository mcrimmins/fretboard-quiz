<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1612">
<title>Fretboard Note Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#1c1612; --panel:#2a211b; --ink:#f3e9dc; --muted:#b8a593;
    --wood:#4a2f1e; --wood2:#3d2617; --fret:#c9c2b8; --string:#e0d6c8;
    --accent:#f0a33a; --good:#4cc38a; --bad:#ef5a5a; --line:#4a3b30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .seg{display:flex;background:var(--panel);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
    padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#1c1612;font-weight:650}
  .stats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
    background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .prompt{text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;margin-bottom:8px}
  .prompt .big{font-size:26px;font-weight:700}
  .prompt .big .note{color:var(--accent)}
  .prompt .sub{font-size:14px;color:var(--muted);min-height:19px}
  .prompt .sub.good{color:var(--good)} .prompt .sub.bad{color:var(--bad)}
  svg{display:block;width:100%;height:auto;user-select:none;touch-action:manipulation}
  .cell{cursor:pointer}
  .notes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
  .notes button{font:inherit;font-size:17px;font-weight:600;padding:13px 4px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .notes button.nat{background:#3a2e25}
  .notes button.good{background:var(--good);color:#10231a;border-color:var(--good)}
  .notes button.bad{background:var(--bad);color:#2a0f0f;border-color:var(--bad)}
  .notes button.reveal{outline:3px solid var(--good);outline-offset:-3px}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer}
  details{margin-top:14px;background:var(--panel);border-radius:12px;padding:4px 12px}
  summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:15px}
  .set{padding:6px 0 12px;display:grid;gap:14px}
  .set label.h{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:14px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1c1612;font-weight:600}
  .range{display:flex;align-items:center;gap:10px;font-size:14px}
  .range select{font:inherit;background:#3a2e25;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .toggle{display:flex;align-items:center;justify-content:space-between;font-size:14px}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .trouble{font-size:13px;color:var(--muted);margin:-4px 2px 8px;min-height:18px}
  .trouble b{color:var(--bad);font-weight:600}
  .set .wide{font:inherit;font-size:14px;padding:9px;border-radius:10px;border:1px solid var(--line);
    background:#3a2e25;color:var(--ink);cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Fretboard Quiz</h1>
    <div class="seg" id="modeSeg">
      <button data-mode="find">Find it</button>
      <button data-mode="name">Name it</button>
    </div>
  </header>

  <div class="stats">
    <span>Score <b id="sScore">0/0</b></span>
    <span>Streak <b id="sStreak">0</b></span>
    <span>Best <b id="sBest">0</b></span>
    <span>Time <b id="sTime">–</b></span>
  </div>
  <div class="trouble" id="trouble"></div>

  <div class="prompt">
    <div class="big" id="pBig"></div>
    <div class="sub" id="pSub"></div>
  </div>

  <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="notes" id="noteBtns"></div>

  <div class="row">
    <button id="skipBtn">Skip</button>
    <button id="resetBtn">Reset score</button>
  </div>

  <details id="settings">
    <summary>Settings</summary>
    <div class="set">
      <div>
        <label class="h">Strings</label>
        <div class="chips" id="strChips"></div>
      </div>
      <div>
        <label class="h">Fret range</label>
        <div class="range">
          <select id="fMin"></select><span>to</span><select id="fMax"></select>
        </div>
      </div>
      <div>
        <label class="h">Note spelling</label>
        <div class="chips" id="accChips">
          <button class="chip" data-acc="sharps">Sharps ♯</button>
          <button class="chip" data-acc="flats">Flats ♭</button>
          <button class="chip" data-acc="both">Both</button>
        </div>
      </div>
      <div class="toggle"><span>Natural notes only (no ♯/♭)</span><input type="checkbox" id="optNat"></div>
      <div class="toggle"><span>Find mode: any string counts</span><input type="checkbox" id="optAny"></div>
      <div class="toggle"><span>Show all note names (study)</span><input type="checkbox" id="optLabels"></div>
      <div class="toggle"><span>Focus on weak spots</span><input type="checkbox" id="optWeak"></div>
      <div class="toggle"><span>Show weak-spot heatmap</span><input type="checkbox" id="optHeat"></div>
      <button class="wide" id="resetHist">Reset weak-spot history</button>
    </div>
  </details>
  <div class="hint">Standard tuning · low E on the left · nut at the top</div>
</div>

<script>
(() => {
  const SH = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const NAT = new Set([0,2,4,5,7,9,11]);
  const OPEN = [4,9,2,7,11,4];                 // strings 6..1 (low E → high E)
  const SNUM = [6,5,4,3,2,1];
  const SLET = ['E','A','D','G','B','e'];
  const MAXF = 15;

  const pretty = s => s.replace('#','♯').replace(/([A-G])b/,'$1♭');
  const pc = (s,f) => (OPEN[s]+f)%12;

  // ---------- persistence ----------
  const store = {
    get(k,d){ try{ const v = localStorage.getItem('fbq_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem('fbq_'+k, JSON.stringify(v)); }catch(e){} }
  };
  const S = Object.assign({
    mode:'find', strings:[true,true,true,true,true,true], fmin:0, fmax:12,
    acc:'sharps', natOnly:false, any:false, labels:false, weak:true, heat:false
  }, store.get('settings', {}));
  const T = Object.assign({ right:0, total:0, streak:0, best:0 }, store.get('stats', {}));
  // per string + note history: { "s:pc": { n, miss, t } }  (n, miss decay so old mistakes fade)
  let H = store.get('hist', {});
  const save = () => { store.set('settings', S); store.set('stats', T); store.set('hist', H); };

  const DECAY = 0.85;
  function record(s, p, ok, dt){
    const k = s+':'+p, h = H[k] || { n:0, miss:0, t:dt };
    h.n = h.n*DECAY + 1;
    h.miss = h.miss*DECAY + (ok?0:1);
    h.t = h.t*0.7 + Math.min(dt,10)*0.3;
    H[k] = h;
  }
  const errRate = h => (h.miss + 0.5) / (h.n + 2);       // smoothed miss rate
  function weight(s, p){
    const h = H[s+':'+p];
    if (!h) return 3;                                     // unseen: show soon
    return 0.4 + 7*errRate(h) + Math.max(0, h.t - 2.5)*0.8; // misses + slow answers
  }

  // ---------- state ----------
  let Q = null, locked = false, tStart = 0, lastKey = '', marks = [];

  // ---------- board drawing ----------
  const svg = document.getElementById('board');
  const GUT = 24, COLW = 50, OPENH = 36, RH = 40;
  const W = GUT + COLW*6 + 6;
  const xs = s => GUT + COLW/2 + COLW*s;
  const yTop = f => f === 0 ? 0 : OPENH + (f-1)*RH;
  const yMid = f => f === 0 ? OPENH/2 : OPENH + (f-1)*RH + RH/2;

  function spellFor(p){
    if (S.acc === 'flats') return FL[p];
    if (S.acc === 'both') return SH[p] === FL[p] ? SH[p] : SH[p]+'/'+FL[p];
    return SH[p];
  }

  function draw(){
    const nF = S.fmax;
    const BH = OPENH + nF*RH + 4;
    svg.setAttribute('viewBox', `0 0 ${W} ${BH}`);
    const bx = GUT, bw = COLW*6;
    let h = '';
    // wood
    h += `<defs><linearGradient id="wd" x1="0" x2="1"><stop offset="0" stop-color="#3d2617"/><stop offset=".5" stop-color="#4f3220"/><stop offset="1" stop-color="#3d2617"/></linearGradient></defs>`;
    h += `<rect x="${bx}" y="${OPENH}" width="${bw}" height="${nF*RH}" fill="url(#wd)" rx="3"/>`;
    // inlays
    const dot = (cx,cy) => `<circle cx="${cx}" cy="${cy}" r="6.5" fill="#e9dcc6" opacity=".55"/>`;
    for (const f of [3,5,7,9,15]) if (f<=nF) h += dot(bx+bw/2, yMid(f));
    if (12<=nF){ h += dot(bx+bw/2-COLW, yMid(12)) + dot(bx+bw/2+COLW, yMid(12)); }
    // frets
    for (let f=1; f<=nF; f++){
      const y = OPENH + f*RH;
      h += `<line x1="${bx}" x2="${bx+bw}" y1="${y}" y2="${y}" stroke="var(--fret)" stroke-width="2.5"/>`;
      h += `<text x="${GUT-7}" y="${yMid(f)+4}" font-size="12" fill="var(--muted)" text-anchor="end">${f}</text>`;
    }
    h += `<text x="${GUT-7}" y="${yMid(0)+4}" font-size="11" fill="var(--muted)" text-anchor="end">0</text>`;
    // nut
    h += `<rect x="${bx-2}" y="${OPENH-4}" width="${bw+4}" height="7" fill="#efe6d6" rx="2"/>`;
    // strings
    for (let s=0; s<6; s++){
      const w = 3.4 - s*0.42;
      h += `<line x1="${xs(s)}" x2="${xs(s)}" y1="4" y2="${OPENH+nF*RH}" stroke="var(--string)" stroke-width="${w}" opacity="${S.strings[s]?0.95:0.25}"/>`;
    }
    // out-of-range dimming
    for (let f=0; f<=nF; f++){
      if (f < S.fmin){
        const hh = f===0 ? OPENH-4 : RH;
        h += `<rect x="${bx}" y="${yTop(f)}" width="${bw}" height="${hh}" fill="#1c1612" opacity=".6"/>`;
      }
    }
    // weak-spot heatmap: green (solid) → amber → red (trouble)
    if (S.heat){
      for (let s=0; s<6; s++) for (let f=S.fmin; f<=nF; f++){
        if (!S.strings[s]) continue;
        const hh = H[s+':'+pc(s,f)]; if (!hh) continue;
        const e = Math.min(1, errRate(hh)*1.6 + Math.max(0, hh.t-2.5)*0.12);
        const hue = Math.round(130 - 130*e);
        const cellH = f===0 ? OPENH-4 : RH;
        h += `<rect x="${GUT+COLW*s+3}" y="${yTop(f)+3}" width="${COLW-6}" height="${cellH-6}" rx="6" fill="hsl(${hue} 75% 50%)" opacity=".42"/>`;
      }
    }
    // study labels
    if (S.labels){
      for (let s=0; s<6; s++) for (let f=S.fmin; f<=nF; f++){
        if (!S.strings[s]) continue;
        const p = pc(s,f), lab = pretty(S.acc==='flats'?FL[p]:SH[p]);
        h += `<text x="${xs(s)}" y="${yMid(f)+4}" font-size="11" fill="#fff" opacity=".45" text-anchor="middle">${lab}</text>`;
      }
    }
    // marks
    for (const m of marks){
      const cx = xs(m.s), cy = yMid(m.f);
      const col = m.kind==='good' ? 'var(--good)' : m.kind==='bad' ? 'var(--bad)' : m.kind==='ring' ? 'none' : 'var(--accent)';
      const stroke = m.kind==='ring' ? `stroke="var(--good)" stroke-width="3"` : `stroke="#1c1612" stroke-width="2"`;
      h += `<circle cx="${cx}" cy="${cy}" r="15" fill="${col}" ${stroke}/>`;
      if (m.label) h += `<text x="${cx}" y="${cy+4.5}" font-size="12.5" font-weight="700" fill="${m.kind==='ring'?'var(--good)':'#1c1612'}" text-anchor="middle">${pretty(m.label)}</text>`;
    }
    // hit targets
    for (let s=0; s<6; s++) for (let f=0; f<=nF; f++){
      const hh = f===0 ? OPENH : RH;
      h += `<rect class="cell" data-s="${s}" data-f="${f}" x="${GUT+COLW*s}" y="${yTop(f)}" width="${COLW}" height="${hh}" fill="transparent"/>`;
    }
    svg.innerHTML = h;
  }

  // ---------- questions ----------
  function candidates(){
    const out = [];
    for (let s=0; s<6; s++){
      if (!S.strings[s]) continue;
      for (let f=S.fmin; f<=S.fmax; f++){
        if (S.natOnly && !NAT.has(pc(s,f))) continue;
        out.push({s,f});
      }
    }
    return out;
  }

  function next(){
    locked = false; marks = [];
    const c = candidates();
    const big = document.getElementById('pBig'), sub = document.getElementById('pSub');
    sub.className = 'sub'; sub.textContent = '';
    if (!c.length){ Q = null; big.textContent = 'Pick at least one string'; draw(); renderButtons(); return; }
    // in Find mode, fret f and f+12 are the same question — collapse duplicates
    let pool = c;
    if (S.mode === 'find'){
      const seen = new Map();
      for (const x of c){ const k = x.s+':'+pc(x.s,x.f); if (!seen.has(k)) seen.set(k,x); }
      pool = [...seen.values()];
    }
    const keyOf = x => S.mode==='find' ? x.s+':'+pc(x.s,x.f) : x.s+':'+x.f;
    const choose = () => {
      if (!S.weak) return pool[Math.floor(Math.random()*pool.length)];
      const ws = pool.map(x => weight(x.s, pc(x.s,x.f)));
      let r = Math.random() * ws.reduce((a,b)=>a+b,0);
      for (let i=0; i<pool.length; i++){ r -= ws[i]; if (r <= 0) return pool[i]; }
      return pool[pool.length-1];
    };
    let pick, tries = 0;
    do { pick = choose(); tries++; }
    while (tries < 20 && pool.length > 1 && keyOf(pick) === lastKey);
    const p = pc(pick.s, pick.f);
    if (S.mode === 'find'){
      let spell = S.acc==='flats' ? FL[p] : S.acc==='both' ? (Math.random()<.5?SH[p]:FL[p]) : SH[p];
      Q = { s:pick.s, pc:p, spell };
      lastKey = pick.s+':'+p;
      big.innerHTML = S.any
        ? `Find <span class="note">${pretty(spell)}</span>`
        : `Find <span class="note">${pretty(spell)}</span> on string ${SNUM[pick.s]} <span style="color:var(--muted);font-weight:500">(${SLET[pick.s]})</span>`;
      sub.textContent = S.any ? 'Tap any spot that plays it' : 'Tap the fret';
    } else {
      Q = { s:pick.s, f:pick.f, pc:p };
      lastKey = pick.s+':'+pick.f;
      marks = [{s:pick.s, f:pick.f, kind:'target'}];
      big.innerHTML = `Name this note`;
      sub.textContent = `String ${SNUM[pick.s]}, fret ${pick.f}`;
    }
    tStart = performance.now();
    draw(); renderButtons();
  }

  function score(ok){
    const dt = (performance.now()-tStart)/1000;
    T.total++;
    if (ok){ T.right++; T.streak++; T.best = Math.max(T.best, T.streak); }
    else { T.streak = 0; try{ navigator.vibrate && navigator.vibrate(70); }catch(e){} }
    record(Q.s, Q.pc, ok, dt);
    document.getElementById('sTime').textContent = dt.toFixed(1)+'s';
    save(); showStats(); showTrouble();
    const sub = document.getElementById('pSub');
    sub.className = 'sub ' + (ok?'good':'bad');
    locked = true;
    setTimeout(next, ok ? 700 : 1800);
  }

  // find-mode tap
  svg.addEventListener('click', e => {
    const el = e.target.closest('[data-s]');
    if (!el || locked || !Q || S.mode !== 'find') return;
    const s = +el.dataset.s, f = +el.dataset.f;
    if (f < S.fmin || f > S.fmax || !S.strings[s]) return;
    const p = pc(s,f);
    const ok = p === Q.pc && (S.any || s === Q.s);
    const sub = document.getElementById('pSub');
    const lab = S.acc==='flats' ? FL[p] : SH[p];
    marks = [{s, f, kind: ok?'good':'bad', label: lab}];
    if (ok){
      sub.textContent = '✓ Correct';
    } else {
      // show all correct spots in range
      for (let ss=0; ss<6; ss++){
        if (!S.any && ss !== Q.s) continue;
        if (!S.strings[ss]) continue;
        for (let ff=S.fmin; ff<=S.fmax; ff++) if (pc(ss,ff)===Q.pc) marks.push({s:ss, f:ff, kind:'ring', label:Q.spell});
      }
      sub.textContent = `✗ That was ${pretty(spellFor(p))}`;
    }
    draw(); score(ok);
  });

  // name-mode buttons
  const btnWrap = document.getElementById('noteBtns');
  function renderButtons(){
    btnWrap.style.display = S.mode==='name' ? 'grid' : 'none';
    if (S.mode !== 'name') return;
    let h = '';
    for (let p=0; p<12; p++){
      if (S.natOnly && !NAT.has(p)) continue;
      h += `<button data-pc="${p}" class="${NAT.has(p)?'nat':''}">${pretty(spellFor(p)).replace('/','<span style="opacity:.5">/</span>')}</button>`;
    }
    btnWrap.innerHTML = h;
    btnWrap.style.gridTemplateColumns = S.natOnly ? 'repeat(4,1fr)' : 'repeat(4,1fr)';
  }
  btnWrap.addEventListener('click', e => {
    const b = e.target.closest('button[data-pc]');
    if (!b || locked || !Q || S.mode !== 'name') return;
    const p = +b.dataset.pc, ok = p === Q.pc;
    b.classList.add(ok?'good':'bad');
    const right = btnWrap.querySelector(`button[data-pc="${Q.pc}"]`);
    if (!ok && right) right.classList.add('reveal');
    marks = [{s:Q.s, f:Q.f, kind: ok?'good':'bad', label: S.acc==='flats'?FL[Q.pc]:SH[Q.pc]}];
    document.getElementById('pSub').textContent = ok ? '✓ Correct' : `✗ It's ${pretty(spellFor(Q.pc))}`;
    draw(); score(ok);
  });

  // ---------- stats ----------
  function showStats(){
    document.getElementById('sScore').textContent = `${T.right}/${T.total}`;
    document.getElementById('sStreak').textContent = T.streak;
    document.getElementById('sBest').textContent = T.best;
  }
  function showTrouble(){
    const el = document.getElementById('trouble');
    const list = Object.entries(H)
      .map(([k,h]) => { const [s,p] = k.split(':').map(Number); return {s,p,h,w:errRate(h) + Math.max(0,h.t-2.5)*0.08}; })
      .filter(x => x.h.n >= 1 && (errRate(x.h) > 0.3 || x.h.t > 4) && S.strings[x.s])
      .sort((a,b) => b.w - a.w).slice(0,4);
    el.innerHTML = list.length
      ? 'Trouble spots: ' + list.map(x => `<b>${pretty(S.acc==='flats'?FL[x.p]:SH[x.p])}</b> on ${SNUM[x.s]}`).join(', ')
      : (Object.keys(H).length ? 'No trouble spots right now 👍' : '');
  }
  document.getElementById('resetHist').onclick = () => { H = {}; save(); showTrouble(); draw(); };
  document.getElementById('resetBtn').onclick = () => {
    T.right = T.total = T.streak = T.best = 0;
    document.getElementById('sTime').textContent = '–';
    save(); showStats();
  };
  document.getElementById('skipBtn').onclick = () => { if (!locked) { T.streak = 0; save(); showStats(); next(); } };

  // ---------- settings UI ----------
  const modeSeg = document.getElementById('modeSeg');
  function syncMode(){ modeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode===S.mode)); }
  modeSeg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.mode = b.dataset.mode; save(); syncMode(); lastKey=''; next();
  });

  const strChips = document.getElementById('strChips');
  function renderStrChips(){
    strChips.innerHTML = SNUM.map((n,i) => `<button class="chip ${S.strings[i]?'on':''}" data-i="${i}">${n} · ${SLET[i]}</button>`).join('');
  }
  strChips.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i; S.strings[i] = !S.strings[i];
    save(); renderStrChips(); next();
  });

  const fMin = document.getElementById('fMin'), fMax = document.getElementById('fMax');
  function renderRange(){
    fMin.innerHTML = Array.from({length:MAXF}, (_,f) => `<option value="${f}" ${f===S.fmin?'selected':''}>${f===0?'Open':f}</option>`).join('');
    fMax.innerHTML = Array.from({length:MAXF}, (_,i) => i+1).map(f => `<option value="${f}" ${f===S.fmax?'selected':''}>${f}</option>`).join('');
  }
  fMin.onchange = () => { S.fmin = +fMin.value; if (S.fmax <= S.fmin) S.fmax = Math.min(MAXF, S.fmin+1); save(); renderRange(); next(); };
  fMax.onchange = () => { S.fmax = +fMax.value; if (S.fmin >= S.fmax) S.fmin = S.fmax-1; save(); renderRange(); next(); };

  const accChips = document.getElementById('accChips');
  function syncAcc(){ accChips.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.acc===S.acc)); }
  accChips.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.acc = b.dataset.acc; save(); syncAcc(); next();
  });

  const optNat = document.getElementById('optNat'), optAny = document.getElementById('optAny'), optLabels = document.getElementById('optLabels');
  optNat.checked = S.natOnly; optAny.checked = S.any; optLabels.checked = S.labels;
  optNat.onchange = () => { S.natOnly = optNat.checked; save(); next(); };
  optAny.onchange = () => { S.any = optAny.checked; save(); if (S.mode==='find') next(); };
  optLabels.onchange = () => { S.labels = optLabels.checked; save(); draw(); };
  const optWeak = document.getElementById('optWeak'), optHeat = document.getElementById('optHeat');
  optWeak.checked = S.weak; optHeat.checked = S.heat;
  optWeak.onchange = () => { S.weak = optWeak.checked; save(); };
  optHeat.onchange = () => { S.heat = optHeat.checked; save(); draw(); };

  // ---------- init ----------
  syncMode(); renderStrChips(); renderRange(); syncAcc(); showStats(); showTrouble(); next();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
